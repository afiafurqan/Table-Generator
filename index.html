<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Table Generator</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1>🧮 Number Table Generator</h1>

    <div class="controls">
      <input type="number" id="number" placeholder="Enter a number" aria-label="Number">
      <input type="number" id="limit" value="10" min="1" max="100" aria-label="Table length">
    </div>

    <button id="generate">Generate Table</button>

    <p id="error" class="error" role="alert"></p>

    <div id="output"></div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
